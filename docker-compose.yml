services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nutriverse
      POSTGRES_USER: nutriverse
      POSTGRES_PASSWORD: nutriverse
    ports:
      - "5432:5432"
    volumes:
      - nutriverse-db:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - nutriverse-redis:/data
  web:
    build: .
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://nutriverse:nutriverse@db:5432/nutriverse
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: replace-with-a-long-random-secret
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
volumes:
  nutriverse-db:
  nutriverse-redis:
