name: CI

on:
  push:
    branches: [main, phase-1b]
  pull_request:
    branches: [main]

jobs:
  python-sqlite:
    name: Python 3.12 (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx anyio

      - name: Run Pytest (SQLite)
        env:
          APP_ENV: development
          DATABASE_URL: sqlite:///./ci_test.db
          JWT_SECRET: ci-temporary-secret-string-at-least-32-chars-long
        run: |
          pytest -q

  python-postgres:
    name: Python 3.12 (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nutriverse_ci
          POSTGRES_USER: nutriverse_ci
          POSTGRES_PASSWORD: nutriverse_ci_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx anyio psycopg2-binary

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg2://nutriverse_ci:nutriverse_ci_pass@localhost:5432/nutriverse_ci
        run: |
          alembic upgrade head

      - name: Run Pytest (PostgreSQL)
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+psycopg2://nutriverse_ci:nutriverse_ci_pass@localhost:5432/nutriverse_ci
          TEST_DATABASE_URL: postgresql+psycopg2://nutriverse_ci:nutriverse_ci_pass@localhost:5432/nutriverse_ci
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-temporary-secret-string-at-least-32-chars-long
        run: |
          pytest -q

  node:
    name: Node.js 20 (Typecheck, Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Next.js build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
        run: npm run build
