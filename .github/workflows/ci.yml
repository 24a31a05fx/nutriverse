name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  python-sqlite:
    name: Python 3.12 (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx anyio

      - name: Run Alembic migrations (SQLite)
        env:
          DATABASE_URL: sqlite:///./ci_test.db
        run: alembic upgrade head

      - name: Run Pytest (SQLite)
        env:
          APP_ENV: development
          DATABASE_URL: sqlite:///./ci_test.db
          JWT_SECRET: ci-temporary-secret-string-at-least-32-chars-long
        run: |
          pytest -v --tb=short

  python-postgres:
    name: Python 3.12 (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nutriverse_ci
          POSTGRES_USER: nutriverse_ci
          POSTGRES_PASSWORD: nutriverse_ci_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx anyio psycopg2-binary

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg2://nutriverse_ci:nutriverse_ci_pass@localhost:5432/nutriverse_ci
        run: |
          alembic upgrade head

      - name: Run Pytest (PostgreSQL)
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+psycopg2://nutriverse_ci:nutriverse_ci_pass@localhost:5432/nutriverse_ci
          TEST_DATABASE_URL: postgresql+psycopg2://nutriverse_ci:nutriverse_ci_pass@localhost:5432/nutriverse_ci
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-temporary-secret-string-at-least-32-chars-long
        run: |
          pytest -v --tb=short

  node:
    name: Node.js 20 (Typecheck, Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Next.js build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
        run: npm run build

  playwright:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        env:
          APP_ENV: development
          DATABASE_URL: sqlite:///./e2e_ci.db
          JWT_SECRET: ci-temporary-secret-string-at-least-32-chars-long
          REDIS_URL: memory://
          ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api
          BACKEND_INTERNAL_URL: http://127.0.0.1:8000
          BASE_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          backend_pid=$!
          npm run dev -- --hostname 127.0.0.1 > frontend.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$frontend_pid" "$backend_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/health

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000 >/dev/null && curl --fail --silent http://127.0.0.1:3000/api/foods >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000 >/dev/null
          npm run test:e2e

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== Backend Log ==="
          cat backend.log || true
          echo "=== Frontend Log ==="
          cat frontend.log || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
