<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ed" />
    <title>Nutriverse — Know. Choose. Nourish.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <a class="brand" href="#dashboard" data-route="dashboard" aria-label="Nutriverse home">
          <span class="brand-mark">✳</span>
          <span>Nutriverse</span>
        </a>
        <p class="eyebrow sidebar-label">Your nourishment space</p>
        <nav class="nav-list">
          <a href="#dashboard" data-route="dashboard" class="nav-link active"><span>⌂</span> Overview</a>
          <a href="#explore" data-route="explore" class="nav-link"><span>⌕</span> Food explorer</a>
          <a href="#packs" data-route="packs" class="nav-link"><span>✦</span> Calin Packs</a>
          <a href="#recipes" data-route="recipes" class="nav-link"><span>◒</span> Recipes</a>
          <a href="#progress" data-route="progress" class="nav-link"><span>↗</span> Progress</a>
          <a href="#scanner" data-route="scanner" class="nav-link"><span>▣</span> Scan a product</a>
          <a href="#assistant" data-route="assistant" class="nav-link"><span>✧</span> Nourish AI</a>
          <a href="#orders" data-route="orders" class="nav-link"><span>▤</span> Orders</a>
          <a href="#admin" data-route="admin" class="nav-link"><span>⚙</span> Admin</a>
        </nav>
        <div class="sidebar-bottom">
          <div class="tip-card">
            <span class="tip-icon">☀</span>
            <div><strong>Small steps count</strong><p>One nourishing choice at a time.</p></div>
          </div>
          <a href="#profile" data-route="profile" class="profile-chip">
            <span class="avatar">AM</span><span><strong>Alex Morgan</strong><small>Good morning!</small></span><span class="chevron">›</span>
          </a>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="mobile-menu" id="mobileMenu" aria-label="Open navigation">☰</button>
          <div class="breadcrumb"><span id="pageKicker">Tuesday, September 24</span><span class="dot">•</span><strong id="pageTitle">Your overview</strong></div>
          <div class="top-actions">
            <button class="icon-button" id="searchButton" aria-label="Search">⌕</button>
            <button class="icon-button notification" aria-label="Notifications">♧<i></i></button>
            <button class="cart-button" data-route="cart"><span>Bag</span><b id="cartCount">3</b></button>
          </div>
        </header>
        <div id="app" class="page"></div>
      </main>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script src="app.js?v=2"></script>
  </body>
</html>
